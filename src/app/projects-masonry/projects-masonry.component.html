<div #resizeContainer
     class="relative w-full"
     [ngStyle]="{'height.px': height}">
  @for (item of (columns | async) ?? []; track item.img) {
    @let imageIndex = $index;
    <div class="absolute transition-all duration-200"
         [ngStyle]="{
           'top.px': item.y,
           'left.px': item.left,
           'width.px': item.width,
           'aspect-ratio': item.aspectRatio
         }">
      <a (click)="onImageClick(item)"
         class="relative block w-full h-full overflow-hidden bg-white text-[1.2rem] font-bold"
         [ngClass]="{'cursor-pointer': item.link}">
        <img #imageElement
             [src]="item.img" [alt]="item.title ?? ''"
             decoding="async"
             class="absolute inset-0 z-10 block w-full h-full object-cover opacity-0"
             (load)="revealImage(imageElement, imageIndex)">
        <div [ngClass]="{
              'bg-opacity-75 text-opacity-100': clickedItem === item.img || hoveredItem === item.img,
              'bg-opacity-0 text-opacity-0': clickedItem !== item.img && hoveredItem !== item.img
            }"
             class="absolute z-20 w-full h-full bg-black text-white
              flex flex-col items-center justify-center p-4
              transition-all duration-300"
             (pointerenter)="onPointerEnter($event, item)"
             (pointerleave)="hoveredItem = undefined"
        >
          <div class="text-[1.3rem] leading-tight text-center"> {{ item.title }}</div>
          <div class="text-[1rem]"> {{ item.subtitle }}</div>
          @if (item.link) {
            <div class="text-[1.2rem] pt-2"> Click for more </div>
          }
        </div>
      </a>
    </div>
  }
</div>
